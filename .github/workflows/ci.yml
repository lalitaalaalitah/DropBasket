name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app 2>/dev/null || true

      - name: Run Test Suite
        run: swift test

      - name: Build Application Bundle
        run: make app

      - name: Verify Bundle & CLI
        run: |
          test -d build/DropBasket.app
          test -x build/DropBasket.app/Contents/MacOS/DropBasket
          test -x build/dropbasket
          ./build/dropbasket --version
          ./build/dropbasket --help

  nix-flake:
    name: Nix Flake Check
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Nix Flake Check
        run: nix flake check --show-trace
